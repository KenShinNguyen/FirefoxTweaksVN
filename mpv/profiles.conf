#profiles.conf: noi de nhung tuy chon chi dung duoc tren MOT he dieu hanh.
#mpv KHONG tu doc file nay. Muon dung thi them dong sau vao cuoi mpv.conf:
#  include=~~/profiles.conf
#(~~/ la thu muc config cua mpv: %APPDATA%\mpv tren Windows, ~/.config/mpv tren macOS/Linux)

#Tat ca deu la profile goi ten - co goi moi chay:
#  mpv --profile=gpu-windows <link>
#hoac them mot dong `profile=gpu-windows` vao mpv.conf cua may do.

#Vi sao khong dung profile-cond=platform=='windows' cho tu dong?
#gpu-api/gpu-context phai duoc dat TRUOC khi cua so video mo ra, ma auto profile
#(profile-cond) chi chay khi bat dau load file, luc do VO da khoi tao roi - dat cung
#khong an. Vi vay mpv.conf giu gpu-api=auto cho an toan, ai can ep thi goi profile.

[gpu-windows]
profile-desc=Windows: Direct3D 11
gpu-api=d3d11
gpu-context=d3d11
#Card yeu hoac driver cu thi thu ANGLE hay Vulkan:
#gpu-api=opengl
#gpu-context=angle
#gpu-api=vulkan
#gpu-context=winvk

[gpu-macos]
profile-desc=macOS: de mpv tu chon (d3d11 KHONG ton tai tren macOS)
gpu-api=auto
gpu-context=auto
#macOS mac dinh chay OpenGL qua lop cocoa-cb; khong co gpu-context=cocoa nua.
#Vulkan qua MoltenVK van con la thu nghiem, chi bat khi da cai MoltenVK:
#gpu-api=vulkan
#gpu-context=macvk

[gpu-linux]
profile-desc=Linux: Vulkan, quay ve OpenGL neu loi
gpu-api=vulkan
gpu-context=auto
#Ep dung backend cu the neu auto chon sai:
#gpu-context=waylandvk  #Wayland + Vulkan
#gpu-context=x11vk      #X11 + Vulkan
#gpu-api=opengl
#gpu-context=wayland    #Wayland + OpenGL
#gpu-context=x11egl     #X11 + OpenGL

#EOF
